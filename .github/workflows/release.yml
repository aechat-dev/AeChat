name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release artifacts
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the tag is on main
        run: ./scripts/verify-tag-on-main.sh "$GITHUB_SHA"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Verify the package version matches the tag
        run: ./scripts/verify-package-version.sh "$GITHUB_REF_NAME"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Full check
        run: pnpm check

      - name: Pack CLI
        id: pack
        run: |
          tarball=$(npm pack --silent | tail -1)
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Swift build and checks
        run: ./scripts/check-macos.sh

      - name: Package app
        run: ./scripts/build-aechat-app.sh

      - name: Verify signature
        run: codesign --verify --deep --strict dist/AeChat.app

      - name: Archive app
        run: ditto -c -k --keepParent dist/AeChat.app dist/AeChat.app.zip

      - name: Checksums
        run: |
          shasum -a 256 \
            "${{ steps.pack.outputs.tarball }}" \
            dist/AeChat.app.zip \
            scripts/install.sh > SHA256SUMS

      - name: Assemble release notes
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${prerelease[@]}" \
            --title "AeChat $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${{ steps.pack.outputs.tarball }}" \
            SHA256SUMS \
            dist/AeChat.app.zip \
            scripts/install.sh
