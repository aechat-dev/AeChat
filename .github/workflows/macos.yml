name: macOS

on:
  # Feature pull requests target dev and use the fast TypeScript gate. The
  # native app is verified on every dev push and on release PRs into main.
  pull_request:
    branches: [main]
  push:
    branches: [dev]
  schedule:
    # Runs on the default branch; dev pushes already cover integration.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app
    # This workflow is separate from ci.yml, so it cannot depend on its
    # TypeScript job; it runs independently to keep the required check alive.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Swift format check
        run: pnpm lint:swift

      - name: Swift build and checks
        run: ./scripts/check-macos.sh

      - name: Package app
        run: ./scripts/build-aechat-app.sh

      - name: Verify signature
        run: codesign --verify --deep --strict dist/AeChat.app

      - name: Archive app
        run: ditto -c -k --keepParent dist/AeChat.app dist/AeChat.app.zip

      - uses: actions/upload-artifact@v7
        with:
          name: AeChat.app
          path: dist/AeChat.app.zip
          if-no-files-found: error
          retention-days: 14
