name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format check
        run: pnpm lint

      - name: Test audit
        run: pnpm test:audit

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: pnpm build

  macos:
    name: macOS app
    # Pull requests get the fast TypeScript gate; the macOS build and package
    # run on main and on manual dispatch, where the artifact matters.
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    needs: typescript
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Swift format check
        run: pnpm lint:swift

      - name: Swift build and checks
        run: ./scripts/check-macos.sh

      - name: Package app
        run: ./scripts/build-aechat-app.sh

      - name: Verify signature
        run: codesign --verify --deep --strict dist/AeChat.app

      - name: Archive app
        run: ditto -c -k --keepParent dist/AeChat.app dist/AeChat.app.zip

      - uses: actions/upload-artifact@v7
        with:
          name: AeChat.app
          path: dist/AeChat.app.zip
          if-no-files-found: error
          retention-days: 14
