name: Bug report
description: Report a reproducible defect in the CLI, bridge or native app.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the private process in
        [SECURITY.md](https://github.com/aechat-dev/AeChat/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, and what did you observe?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the exact commands, flags and host configuration.
      placeholder: |
        1. aechat register ...
        2. aechat send ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, or the output of `git rev-parse --short HEAD`.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: macOS version
      options:
        - macOS 26
        - macOS 15
        - macOS 14
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `node --version`, `agmsg --version` and `aechat doctor --json`.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant audit output
      description: "`aechat log --message <id>` or `aechat history`, with secrets and personal paths removed."
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed tokens, credentials, private message bodies and personal paths.
          required: true
